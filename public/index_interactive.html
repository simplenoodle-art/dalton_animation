<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 動畫模式</title>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('頁面發生錯誤:', message, 'at', source, lineno, colno);
            document.getElementById('error-container').style.display = 'block';
            document.getElementById('error-message').textContent = message;
            return true;
        };
    </script>
    <script src="p5.js"></script>
    <script src="p5.sound.min.js"></script>
    <script src="mqtt/mqtt.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #loading-spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #error-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.1);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        #error-container h2 { color: #d9534f; margin-bottom: 20px; }
        #retry-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        #retry-button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div id="loading">
        <div id="loading-spinner"></div>
        <p>正在載入...</p>
    </div>
    <div id="error-container">
        <h2>發生錯誤</h2>
        <p id="error-message"></p>
        <button id="retry-button" onclick="location.reload()">重新載入頁面</button>
    </div>
    <script src="sketch_merge_interactive.js"></script>
    <script>
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        };
    </script>
</body>
</html>
