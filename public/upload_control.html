<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖片上傳控制介面</title>
  <script src="mqtt/mqtt.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #111827;
      --card:         #1f2937;
      --border:       #374151;
      --accent:       #1e3a5f;
      --btn-active:   #e53e3e;
      --btn-disabled: #374151;
      --text:         #f3f4f6;
      --text-muted:   #9ca3af;
      --green:        #10b981;
      --yellow:       #f59e0b;
      --red:          #ef4444;
      --blue:         #3b82f6;
    }

    body {
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container { width: 100%; max-width: 480px; }

    /* ── 標題 ── */
    h1 {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    /* ── MQTT 狀態列 ── */
    .mqtt-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--btn-disabled);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.connecting { background: var(--yellow); animation: blink 1s ease-in-out infinite; }
    .dot.connected  { background: var(--green); }
    .dot.error      { background: var(--red); }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
    @keyframes spin  { to{transform:rotate(360deg)} }

    /* ── 卡片 ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    /* ── 狀態列 ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      background: var(--accent);
      border: 1px solid transparent;
      margin-bottom: 18px;
      font-size: 0.84rem;
      transition: background 0.3s, border-color 0.3s;
    }
    .status-bar.state-ready {
      background: #052e16;
      border-color: var(--green);
    }
    .status-bar.state-uploading {
      background: #1e1b4b;
      border-color: var(--blue);
    }
    .status-bar .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }
    .status-icon { font-size: 1rem; flex-shrink: 0; }

    /* ── 拖放區 ── */
    .drop-zone {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 14px;
      user-select: none;
    }
    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--btn-active);
      background: rgba(229,62,62,0.04);
    }
    .drop-zone.has-file {
      border-color: var(--green);
      background: rgba(16,185,129,0.04);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon  { font-size: 2.2rem; margin-bottom: 8px; }
    .drop-hint  { font-size: 0.88rem; color: var(--text-muted); }
    .drop-hint strong { color: var(--text); }
    .drop-sub   { font-size: 0.74rem; color: var(--text-muted); margin-top: 4px; }

    /* ── 預覽 ── */
    #preview-wrap {
      display: none;
      text-align: center;
      margin-bottom: 14px;
    }
    #preview-img {
      max-height: 180px;
      max-width: 100%;
      border-radius: 8px;
      object-fit: contain;
      border: 1px solid var(--border);
    }
    #file-info {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    /* ── Alert ── */
    #alert-box {
      display: none;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 14px;
    }
    #alert-box.type-error   { background: rgba(239,68,68,0.12);  border: 1px solid var(--red);    color: #fca5a5; }
    #alert-box.type-warning { background: rgba(245,158,11,0.12); border: 1px solid var(--yellow); color: #fcd34d; }

    /* ── Upload 按鈕 ── */
    #upload-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      background: var(--btn-active);
      color: #fff;
    }
    #upload-btn:disabled {
      background: var(--btn-disabled);
      color: var(--text-muted);
      cursor: not-allowed;
    }
    #upload-btn:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(229,62,62,0.45);
    }
    #upload-btn:not(:disabled):active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <h1>圖片上傳控制介面</h1>

    <div class="mqtt-bar">
      <div class="dot connecting" id="mqtt-dot"></div>
      <span id="mqtt-label">連接 MQTT 中...</span>
    </div>

    <div class="card">
      <!-- 狀態列 -->
      <div class="status-bar" id="status-bar">
        <div class="spinner" id="status-spinner"></div>
        <span class="status-icon" id="status-icon" style="display:none"></span>
        <span id="status-text">等待 Generator 就緒中...</span>
      </div>

      <!-- 拖放 / 選擇區 -->
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".jpg,.jpeg,image/jpeg">
        <div class="drop-icon">🖼️</div>
        <div class="drop-hint"><strong>點擊選擇</strong>或拖曳圖片至此</div>
        <div class="drop-sub">僅支援 JPG / JPEG 格式・比例需為 2:3</div>
      </div>

      <!-- 預覽 -->
      <div id="preview-wrap">
        <img id="preview-img" alt="預覽圖">
        <div id="file-info"></div>
      </div>

      <!-- 提示訊息 -->
      <div id="alert-box"></div>

      <!-- 上傳按鈕 -->
      <button id="upload-btn" disabled>Upload</button>
    </div>
  </div>

  <script>
    // ===================================================================
    // URL 參數解析（支援 ?mqtt_host=192.168.x.x&mqtt_port=8083）
    // ===================================================================
    const urlParams = new URLSearchParams(window.location.search);
    const mqttHost  = urlParams.get('mqtt_host') || '192.168.1.194';
    const mqttPort  = urlParams.get('mqtt_port') || '8083';
    const mqttPath  = urlParams.get('mqtt_path') || '/mqtt';
    const mqttUrl   = `ws://${mqttHost}:${mqttPort}${mqttPath}`;

    // ===================================================================
    // DOM
    // ===================================================================
    const uploadBtn    = document.getElementById('upload-btn');
    const fileInput    = document.getElementById('file-input');
    const dropZone     = document.getElementById('drop-zone');
    const previewWrap  = document.getElementById('preview-wrap');
    const previewImg   = document.getElementById('preview-img');
    const fileInfo     = document.getElementById('file-info');
    const alertBox     = document.getElementById('alert-box');
    const mqttDot      = document.getElementById('mqtt-dot');
    const mqttLabel    = document.getElementById('mqtt-label');
    const statusBar    = document.getElementById('status-bar');
    const statusSpinner= document.getElementById('status-spinner');
    const statusIcon   = document.getElementById('status-icon');
    const statusText   = document.getElementById('status-text');

    // ===================================================================
    // 應用程式狀態
    // ===================================================================
    let mqttClient    = null;
    let selectedFile  = null;   // 通過驗證的 File 物件
    let isReady       = false;  // generator 已就緒
    let isUploading   = false;  // 已送出、等待 physionotrace/completed
    let pollTimer     = null;   // setInterval handle

    // ===================================================================
    // UI 輔助
    // ===================================================================
    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className   = `type-${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function setStatusBar(state) {
      statusBar.className = 'status-bar';
      statusSpinner.style.display = 'none';
      statusIcon.style.display    = 'none';

      if (state === 'polling') {
        statusSpinner.style.display = 'block';
        statusText.textContent = '等待 Generator 就緒中...';
      } else if (state === 'ready') {
        statusBar.classList.add('state-ready');
        statusIcon.textContent = '✅';
        statusIcon.style.display = 'inline';
        statusText.textContent = 'Generator 已就緒，可上傳圖片';
      } else if (state === 'uploading') {
        statusBar.classList.add('state-uploading');
        statusIcon.textContent = '⏳';
        statusIcon.style.display = 'inline';
        statusText.textContent = '圖片已送出，等待處理完成...';
      }
    }

    // ===================================================================
    // 輪詢：每 0.5 秒發送 generator/isReady {"isReady":"ask"}
    // ===================================================================
    function sendAsk() {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish('generator/isReady', JSON.stringify({ isReady: 'ask' }), { qos: 1 });
      }
    }

    function startPolling() {
      isReady      = false;
      isUploading  = false;
      uploadBtn.disabled = true;
      setStatusBar('polling');
      stopPolling();
      sendAsk();                                  // 立刻問一次
      pollTimer = setInterval(sendAsk, 500);
    }

    function stopPolling() {
      if (pollTimer !== null) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    // ===================================================================
    // 新一輪（physionotrace/completed 後重置）
    // ===================================================================
    function resetRound() {
      selectedFile        = null;
      fileInput.value     = '';
      previewImg.src      = '';
      fileInfo.textContent = '';
      previewWrap.style.display  = 'none';
      dropZone.classList.remove('has-file');
      hideAlert();
      startPolling();
    }

    // ===================================================================
    // 圖片驗證（格式 + 2:3 比例）
    // ===================================================================
    function validateAndPreview(file) {
      hideAlert();

      if (!file) return;

      // 格式檢查
      if (file.type !== 'image/jpeg') {
        showAlert('請選擇 JPG / JPEG 格式的圖片');
        clearSelection();
        return;
      }

      const objectUrl = URL.createObjectURL(file);
      const img = new Image();

      img.onload = () => {
        const ratio  = img.naturalWidth / img.naturalHeight;
        const target = 2 / 3;

        if (Math.abs(ratio - target) > 0.01) {
          showAlert(
            `圖片比例不符（目前 ${img.naturalWidth}×${img.naturalHeight}，` +
            `比例 ${(ratio).toFixed(3)}），請選擇 2:3 比例的圖片`
          );
          clearSelection();
          URL.revokeObjectURL(objectUrl);
          return;
        }

        // 通過驗證
        selectedFile = file;
        dropZone.classList.add('has-file');
        previewImg.src   = objectUrl;
        fileInfo.textContent =
          `${file.name}　${img.naturalWidth} × ${img.naturalHeight}`;
        previewWrap.style.display = 'block';
        URL.revokeObjectURL(objectUrl);
      };

      img.onerror = () => {
        showAlert('圖片無法讀取，請重新選擇');
        clearSelection();
        URL.revokeObjectURL(objectUrl);
      };

      img.src = objectUrl;
    }

    function clearSelection() {
      selectedFile = null;
      dropZone.classList.remove('has-file');
      previewWrap.style.display = 'none';
    }

    // ===================================================================
    // 圖片處理：縮放至 1184×1776 → WebP → Base64
    // ===================================================================
    function processImage(file) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          const canvas   = document.createElement('canvas');
          canvas.width   = 1184;
          canvas.height  = 1776;
          canvas.getContext('2d').drawImage(img, 0, 0, 1184, 1776);

          // toDataURL → "data:image/webp;base64,XXXX..."
          const dataUrl = canvas.toDataURL('image/webp', 0.92);
          const base64  = dataUrl.split(',')[1];
          URL.revokeObjectURL(objectUrl);
          resolve(base64);
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('圖片讀取失敗'));
        };

        img.src = objectUrl;
      });
    }

    // ===================================================================
    // Upload 按鈕
    // ===================================================================
    uploadBtn.addEventListener('click', async () => {
      if (!isReady || isUploading) return;

      if (!selectedFile) {
        showAlert('尚未成功選擇圖片');
        return;
      }

      hideAlert();
      isUploading        = true;
      uploadBtn.disabled = true;
      setStatusBar('uploading');

      try {
        const base64 = await processImage(selectedFile);
        mqttClient.publish(
          'generator/init_image',
          JSON.stringify({ image: base64 }),
          { qos: 1 }
        );
        console.log('[Upload] generator/init_image 已發送');
      } catch (err) {
        showAlert('圖片處理失敗：' + err.message);
        isUploading        = false;
        uploadBtn.disabled = false;
        setStatusBar('ready');
      }
    });

    // ===================================================================
    // 檔案選擇 & Drag-and-Drop
    // ===================================================================
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) validateAndPreview(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const files = e.dataTransfer.files;
      if (files.length > 0) validateAndPreview(files[0]);
    });

    // ===================================================================
    // MQTT
    // ===================================================================
    function connectMQTT() {
      const clientId = 'uploader_' + Math.random().toString(16).substr(2, 8);

      mqttClient = mqtt.connect(mqttUrl, {
        keepalive:       60,
        clientId,
        clean:           true,
        reconnectPeriod: 3000,
        connectTimeout:  30000,
        protocolId:      'MQTT',
        protocolVersion: 4,
        rejectUnauthorized: false
      });

      mqttClient.on('connect', () => {
        mqttDot.className  = 'dot connected';
        mqttLabel.textContent = `已連接　${mqttUrl}`;

        mqttClient.subscribe('generator/isReady_reply',  { qos: 1 }, (err) => {
          if (err) console.error('訂閱 generator/isReady_reply 失敗:', err);
        });
        mqttClient.subscribe('physionotrace/completed', { qos: 1 }, (err) => {
          if (err) console.error('訂閱 physionotrace/completed 失敗:', err);
        });

        startPolling();
      });

      mqttClient.on('reconnect', () => {
        mqttDot.className  = 'dot connecting';
        mqttLabel.textContent = '重新連接中...';
        stopPolling();
      });

      mqttClient.on('offline', () => {
        mqttDot.className  = 'dot error';
        mqttLabel.textContent = '連線中斷';
        stopPolling();
        uploadBtn.disabled = true;
        setStatusBar('polling');
      });

      mqttClient.on('error', (err) => {
        mqttDot.className  = 'dot error';
        mqttLabel.textContent = 'MQTT 錯誤：' + err.message;
        console.error('MQTT error:', err);
      });

      mqttClient.on('message', (topic, payload) => {
        let data;
        try {
          data = JSON.parse(payload.toString());
        } catch (e) {
          console.warn('[MQTT] 無法解析訊息:', payload.toString());
          return;
        }

        // ── Generator 就緒回覆 ──
        if (topic === 'generator/isReady_reply') {
          if (data.isReady === true) {
            if (!isReady) {
              isReady            = true;
              uploadBtn.disabled = false;
              setStatusBar('ready');
              console.log('[MQTT] Generator 已就緒');
            }
          } else {
            if (isReady) {
              isReady            = false;
              uploadBtn.disabled = true;
              setStatusBar('polling');
              console.log('[MQTT] Generator 尚未就緒');
            }
          }
        }

        // ── 處理完成，重置 ──
        if (topic === 'physionotrace/completed' && data.status === 'completed') {
          console.log('[MQTT] physionotrace/completed，開始新一輪');
          resetRound();
        }
      });
    }

    // ===================================================================
    // 啟動
    // ===================================================================
    connectMQTT();
  </script>
</body>
</html>
